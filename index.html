/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #f8fafc;
    --bg-secondary: #ffffff;
    --card: rgba(255,255,255,0.72);
    --text: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-light: #60a5fa;
    --blue-soft: #eff6ff;
    --border: rgba(148,163,184,0.25);
    --nav: rgba(255,255,255,0.75);
    --dark: #020617;
    --shadow: rgba(15,23,42,0.10);
}

[data-theme="dark"] {
    --bg: #020617;
    --bg-secondary: #0f172a;
    --card: rgba(15,23,42,0.72);
    --text: #f8fafc;
    --muted: #94a3b8;
    --blue: #60a5fa;
    --blue-light: #93c5fd;
    --blue-soft: rgba(37,99,235,0.12);
    --border: rgba(148,163,184,0.18);
    --nav: rgba(2,6,23,0.75);
    --shadow: rgba(0,0,0,0.3);
}

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background .3s ease, color .3s ease;
}

a {
    color: inherit;
}

/* =========================================================
   MOUSE GLOW
========================================================= */

.cursor-glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(37,99,235,.13),
            transparent 70%
        );
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: -1;
    transition: left .15s ease, top .15s ease;
}

/* =========================================================
   BACKGROUND ORBS
========================================================= */

.bg-orb {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .18;
    pointer-events: none;
    z-index: -2;
}

.orb-one {
    background: #2563eb;
    top: 5%;
    left: -100px;
    animation: floatOrb 12s ease-in-out infinite;
}

.orb-two {
    background: #7c3aed;
    right: -120px;
    top: 50%;
    animation: floatOrb 15s ease-in-out infinite reverse;
}

@keyframes floatOrb {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(70px);
    }
}

/* =========================================================
   NAVIGATION
========================================================= */

nav {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1100px, calc(100% - 30px));
    z-index: 1000;
    background: var(--nav);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 40px var(--shadow);
}

.navbar {
    height: 68px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    text-decoration: none;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--blue);
}

.navlinks {
    display: flex;
    gap: 5px;
}

.navlinks a {
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 13px;
    border-radius: 10px;
    transition: .25s;
}

.navlinks a:hover,
.navlinks a.active {
    color: var(--blue);
    background: var(--blue-soft);
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.theme-toggle,
.menu-toggle {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    font-size: 17px;
}

.menu-toggle {
    display: none;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 150px 20px 90px;
    position: relative;
}

.hero-grid {
    width: min(1100px, 100%);
    margin: auto;
    display: grid;
    grid-template-columns: 1.35fr .8fr;
    gap: 70px;
    align-items: center;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--blue-soft);
    border: 1px solid var(--border);
    color: var(--blue);
    padding: 8px 14px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .7px;
    margin-bottom: 22px;
}

.badge::before {
    content: "";
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(34,197,94,.12);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}

.hero h1 {
    font-size: clamp(48px, 7vw, 78px);
    line-height: 1;
    letter-spacing: -4px;
    max-width: 800px;
    margin-bottom: 25px;
}

.gradient-text {
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed,
            #2563eb
        );

    background-size: 200% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: gradientMove 4s linear infinite;
}

@keyframes gradientMove {
    to {
        background-position: 200% center;
    }
}

.hero-description {
    color: var(--muted);
    font-size: 18px;
    max-width: 680px;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 21px;
    border-radius: 11px;
    text-decoration: none;
    font-weight: 700;
    border: 1px solid var(--border);
    transition: transform .25s, box-shadow .25s;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px var(--shadow);
}

.btn-primary {
    color: white;
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );
    border: none;
}

.btn-secondary {
    background: var(--card);
    color: var(--text);
}

.btn-resume {
    background:
        linear-gradient(
            135deg,
            #0f172a,
            #334155
        );

    color: white;
    border: 1px solid rgba(255,255,255,.08);
}

.btn-resume:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(15,23,42,.25);
}

/* =========================================================
   PROFILE CARD
========================================================= */

.profile-wrapper {
    perspective: 1000px;
}

.profile-card {
    position: relative;
    padding: 30px;
    border-radius: 28px;
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    box-shadow: 0 30px 70px var(--shadow);
    transform-style: preserve-3d;
    transition: transform .2s ease;
    animation: cardFloat 5s ease-in-out infinite;
}

@keyframes cardFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

.profile-card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 28px;
    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.35),
            transparent 50%,
            rgba(124,58,237,.3)
        );
    z-index: -1;
    opacity: .5;
}

.avatar {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    font-size: 38px;
    font-weight: 900;
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
    box-shadow: 0 15px 40px rgba(37,99,235,.3);
    margin-bottom: 20px;
}

.profile-card h3 {
    font-size: 25px;
}

.profile-card > p {
    color: var(--muted);
    font-size: 14px;
}

.info {
    margin-top: 22px;
}

.info div {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.info span {
    color: var(--muted);
}

/* =========================================================
   SECTIONS
========================================================= */

section {
    padding: 110px 20px;
}

.container {
    width: min(1100px, 100%);
    margin: auto;
}

.section-head {
    margin-bottom: 45px;
}

.eyebrow {
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    font-size: clamp(34px, 5vw, 48px);
    line-height: 1.1;
    letter-spacing: -2px;
    margin-top: 7px;
}

.section-head p {
    color: var(--muted);
    max-width: 700px;
    margin-top: 12px;
}

/* =========================================================
   REVEAL
========================================================= */

.reveal {
    opacity: 0;
    transform: translateY(35px);
    transition: opacity .8s ease, transform .8s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
}

.about-text {
    color: var(--muted);
    font-size: 16px;
}

.skills {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.skill-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px;
    transition: .25s;
}

.skill-item:hover {
    transform: translateY(-4px);
    border-color: rgba(37,99,235,.35);
}

.skill-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
}

.skill-top span {
    color: var(--muted);
}

.skill-bar {
    height: 6px;
    border-radius: 10px;
    background: var(--border);
    overflow: hidden;
}

.skill-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );
    transition:
        width 1.5s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   TECHNICAL PROFICIENCIES
========================================================= */

.proficiency-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-top: 35px;
}

.proficiency {
    padding: 18px;
    border-radius: 15px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    transition: .25s;
}

.proficiency:hover {
    transform: translateY(-5px);
    border-color: rgba(37,99,235,.35);
}

.proficiency span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    margin-top: 4px;
}

/* =========================================================
   SERVICES
========================================================= */

    background: var(--bg-secondary);

}
